<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Student Showcase - Club Members</title>
    <style>
body {
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Georgia, serif;
            text-align: center;
        }

        header {
            background-color: #0f0f0f;
            padding: 20px 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 24px;
            font-style: italic;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav a {
            color: #ffffff;
            font-size: 16px;
            text-decoration: underline;
            max-width: 130px;
        }

        main {
            padding: 35px;
            max-width: 750px;
            margin: 0 auto;
        }

        input, button {
            font-family: Georgia, serif;
            font-size: 16px;
            padding: 6px 10px;
            margin: 6px 6px 10px 0;
            border-radius: 6px;
        }

        .output-box {
            margin-top: 12px;
            padding: 12px;
            background-color: #181818;
            white-space: pre-line;
            border-radius: 6px;
        }

    </style>
</head>
<body>
    <header>
        <div class="brand">Student<br>Showcase</div>
        <nav>
            <a href="index.html">Homepage</a>
            <a href="club.html">School Club Members</a>
            <a href="creator.html">Meet the Creator</a>
            <a href="checker.html">Element Checker</a>
        </nav>
    </header>
     
    <main>
        <form>
            <h1>SSC Club Checker - Candidate Verification System</h1>
            <input type="text" id="first_name" placeholder="Enter your first name"> <br>
            <input type="text" id="last_name" placeholder="Enter your last name"> <br>
            <button type="button" id="check-button">Enter</button>
        </form>
        <div id="result" class="output-box">Add your name to verify club membership.</div>
    </main>
    <script type="py" src="club.py"></script>
</body>
</html>
